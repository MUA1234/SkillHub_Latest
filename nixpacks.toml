# Nixpacks configuration for SkillHub Frontend (Next.js)
# Optimized for faster builds with caching

[phases.setup]
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = ["npm ci --prefer-offline"]
cacheDirectories = ["node_modules", ".npm"]

[phases.build]
cmds = ["npm run build"]
cacheDirectories = [".next/cache"]

[start]
cmd = "node .next/standalone/server.js"

[variables]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
