# Railway service config — SkillHub FULL backend (Phoenix gateway + Python
# FastAPI in one image via Dockerfile.backend). Phoenix binds Railway's $PORT
# and strangler-proxies Python-only routes over 127.0.0.1:8001.
#
# The Next.js frontend is hosted on Vercel, NOT here.
# Env vars are set in the Railway dashboard (see DEPLOY_RAILWAY.md) — not in
# this file, so no secrets live in the repo.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.backend"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
