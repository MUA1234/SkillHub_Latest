# Railway Configuration for SkillHub Platform
# Frontend service configuration (Next.js) - Optimized for fast builds

[build]
# Use Docker for better caching and multi-stage builds
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Use the standalone server (started via node server.js in Dockerfile)
healthcheckPath = "/"
healthcheckTimeout = 300
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
