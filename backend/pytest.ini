[pytest]
# Phase 0 test suite. Pure-logic unit tests run with no network or DB; the
# httpx data client's query/URL construction is the first thing under test.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# auto mode: async test/fixture functions run on an event loop without needing
# per-function markers or pytest_asyncio.fixture decorators.
asyncio_mode = auto
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
