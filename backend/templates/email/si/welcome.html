<!doctype html>
<html lang="si">
  <body style="font-family: 'Noto Sans Sinhala', system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px; color: #1f2937;">
    <h1 style="color: #047857;">සාදරයෙන් පිළිගනිමු{% if first_name %}, {{ first_name }}{% endif %}!</h1>
    <p>ඔබේ {{ from_name }} ගිණුම සූදානම්{% if role %} ({{ role }}){% endif %}. ඉගෙනීම ආරම්භ කිරීමට පුරනය වන්න.</p>
    <p style="margin: 32px 0;">
      <a href="{{ frontend_url }}"
         style="background: #047857; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; display: inline-block;">
        SkillHub විවෘත කරන්න
      </a>
    </p>
    <p style="color: #6b7280; font-size: 13px;">උපකාර අවශ්‍ය නම් මෙම ඊමේල් එකට පිළිතුරු දෙන්න.</p>
  </body>
</html>
