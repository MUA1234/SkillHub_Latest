<!doctype html>
<html lang="ta">
  <body style="font-family: 'Noto Sans Tamil', system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px; color: #1f2937;">
    <h1 style="color: #047857;">வரவேற்கிறோம்{% if first_name %}, {{ first_name }}{% endif %}!</h1>
    <p>உங்கள் {{ from_name }} கணக்கு தயாராக உள்ளது{% if role %} ({{ role }}){% endif %}. கற்றலைத் தொடர எப்போது வேண்டுமானாலும் உள்நுழையவும்.</p>
    <p style="margin: 32px 0;">
      <a href="{{ frontend_url }}"
         style="background: #047857; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; display: inline-block;">
        SkillHub-ஐ திற
      </a>
    </p>
    <p style="color: #6b7280; font-size: 13px;">உதவி தேவைப்பட்டால், இந்த மின்னஞ்சலுக்கு பதிலளிக்கவும்.</p>
  </body>
</html>
