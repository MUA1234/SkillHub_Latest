<!doctype html>
<html lang="en">
  <body style="font-family: system-ui, -apple-system, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px; color: #1f2937;">
    <h1 style="color: #047857;">Welcome to {{ from_name }}{% if first_name %}, {{ first_name }}{% endif %}!</h1>
    <p>Please confirm your email address to finish setting up your account.</p>
    <p style="margin: 32px 0;">
      <a href="{{ verification_url }}"
         style="background: #047857; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; display: inline-block;">
        Verify my email
      </a>
    </p>
    <p style="color: #6b7280; font-size: 13px;">
      Or copy and paste this link into your browser:<br>
      <a href="{{ verification_url }}">{{ verification_url }}</a>
    </p>
    <p style="color: #6b7280; font-size: 13px;">This link expires in 24 hours.</p>
  </body>
</html>
