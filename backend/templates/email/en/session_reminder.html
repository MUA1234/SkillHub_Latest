<!doctype html>
<html lang="en">
  <body style="font-family: system-ui, -apple-system, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px; color: #1f2937;">
    <h1 style="color: #047857;">Your session starts soon{% if first_name %}, {{ first_name }}{% endif %}.</h1>
    <p><strong>{{ session_title }}</strong> with {{ teacher_name }} starts at <strong>{{ when_local }}</strong>.</p>
    <p style="margin: 32px 0;">
      <a href="{{ join_url }}"
         style="background: #047857; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; display: inline-block;">
        Open the session
      </a>
    </p>
    <p style="color: #6b7280; font-size: 13px;">Tip: open the link a few minutes early to test your mic + camera.</p>
  </body>
</html>
